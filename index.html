<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>지우의 첫 번째 생일에 초대합니다</title>
<meta property="og:title" content="지우의 첫 번째 생일에 초대합니다">
<meta property="og:description" content="2026년 10월 25일 일요일 오후 12시 · 롯데시티호텔 구로">
<meta property="og:image" content="https://khwook.github.io/jiwoo1st/images/og.png">
<meta property="og:type" content="website">
<!-- 유일한 외부 리소스: Google Fonts. 폰 기종별 시스템 폰트 편차를 없애기 위해 사용. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root {
    /* 수달 일러스트 팔레트: 크림 바탕 + 코코아 브라운 + 핑크 하트 + 하늘색 물방울 */
    --bg: #fff8f2;
    --paper: #ffffff;
    --ink: #6b4a35;
    --brown: #8c6243;
    --muted: #b0978a;
    --pink: #f59bb0;
    --pink-soft: #fde6ec;
    --blue: #9fd3f4;
    --blue-soft: #e6f4fc;
    --yellow: #f8d878;
    --cream: #f4e5d3;
    --line: #f1e3d8;
    --head: "Jua", "Apple SD Gothic Neo", sans-serif;
    --body: "Gowun Dodum", "Apple SD Gothic Neo", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    font-family: var(--body);
    background: var(--bg); color: var(--ink);
    line-height: 1.8; word-break: keep-all;
    overflow-x: hidden;
  }
  main { max-width: 480px; margin: 0 auto; position: relative; z-index: 1; }
  section { padding: 64px 24px; position: relative; }
  h2 {
    font-family: var(--head); font-size: 13px; letter-spacing: .3em; font-weight: 400;
    color: var(--pink); text-align: center; margin-bottom: 6px;
  }
  .h2-sub {
    text-align: center; font-family: var(--head); font-size: 26px; margin-bottom: 30px; color: var(--brown);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .h2-sub::before, .h2-sub::after {
    content: "♥"; font-size: 16px; color: var(--pink); display: inline-block;
    animation: heartbeat 1.6s ease-in-out infinite;
  }
  .h2-sub::after { animation-delay: .8s; }
  @keyframes heartbeat {
    0%, 100% { transform: scale(1); } 15% { transform: scale(1.35); } 30% { transform: scale(1); } 45% { transform: scale(1.2); }
  }
  p { text-align: center; }
  .muted { color: var(--muted); font-size: 14px; }

  /* ---------- 스크롤 등장 ---------- */
  .reveal { opacity: 0; transform: translateY(24px) scale(.98); transition: opacity .7s ease, transform .7s cubic-bezier(.22,1,.36,1); }
  .reveal.in { opacity: 1; transform: none; }
  .reveal[data-delay="1"] { transition-delay: .1s; } .reveal[data-delay="2"] { transition-delay: .2s; } .reveal[data-delay="3"] { transition-delay: .3s; }

  /* ---------- 배경: 떠다니는 하트/물방울 ---------- */
  .float-layer { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .float-layer span {
    position: absolute; bottom: -40px; left: var(--x);
    font-size: var(--s); opacity: 0;
    animation: floatUp var(--d) linear infinite; animation-delay: var(--delay);
    filter: blur(.2px);
  }
  .float-layer .bubble {
    width: var(--s); height: var(--s); border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff 0 25%, var(--blue) 26% 100%);
    opacity: 0; box-shadow: inset -2px -2px 4px rgba(255,255,255,.7);
  }
  .float-layer .heart { color: var(--pink); }
  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) rotate(0); opacity: 0; }
    10%  { opacity: .55; }
    50%  { transform: translateY(-50vh) translateX(18px) rotate(12deg); }
    90%  { opacity: .4; }
    100% { transform: translateY(-110vh) translateX(-10px) rotate(-10deg); opacity: 0; }
  }

  /* ---------- 진행률 바 (파스텔) ---------- */
  .progress { position: fixed; top: 0; left: 0; right: 0; height: 6px; z-index: 100; background: var(--line); }
  .progress-bar {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, var(--pink), var(--yellow), var(--blue), var(--pink));
    background-size: 200% 100%; animation: shimmer 4s linear infinite;
    transform-origin: left center; transform: scaleX(0); will-change: transform;
  }
  @keyframes shimmer { to { background-position: 200% 0; } }

  /* ---------- 히어로 ---------- */
  .hero { text-align: center; padding-top: 64px; }
  .hero .eyebrow {
    font-family: var(--head); font-size: 13px; letter-spacing: .32em; color: var(--muted);
    animation: popIn .8s cubic-bezier(.34,1.56,.64,1) both;
  }
  .hero .num-wrap {
    position: relative; margin: 24px auto 4px; padding: 6px 36px; width: fit-content; cursor: pointer; -webkit-tap-highlight-color: transparent;
    animation: popIn .9s .15s cubic-bezier(.34,1.56,.64,1) both;
  }
  .hero .num {
    font-size: 140px; line-height: 1; font-family: var(--head); user-select: none;
    color: var(--pink);
    text-shadow: 0 6px 0 #e6849c, 0 10px 18px rgba(245,155,176,.35);
    animation: wobble 3s ease-in-out infinite;
  }
  @keyframes wobble { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
  /* 숫자 1 주변: 살짝 깜빡이는 반짝이 */
  .num-wrap .sparkle.n1 { left: 6px; top: 28px; }
  .num-wrap .sparkle.n2 { right: 2px; top: 60px; animation-delay: .9s; transform: scale(.75); background: var(--pink); }
  .num-wrap .sparkle.n3 { left: 22px; bottom: 30px; animation-delay: 1.5s; transform: scale(.6); background: var(--blue); }
  .num-wrap .sparkle.n4 { right: 20px; top: 14px; animation-delay: .4s; transform: scale(.5); }
  .num-wrap.pop .num { animation: happyJump .6s cubic-bezier(.34,1.56,.64,1); }
  @keyframes happyJump { 0% { transform: scale(1); } 40% { transform: scale(1.15) translateY(-10px); } 100% { transform: scale(1); } }

  /* 지우 사진: 둥실 떠 있는 프레임 + 반짝이/물방울 */
  .photo-stage { position: relative; margin: 20px auto 0; width: 100%; max-width: 340px; animation: popIn 1s .35s cubic-bezier(.34,1.56,.64,1) both; }
  .hero-photo {
    display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover;
    border-radius: 28px; background: var(--line); border: 8px solid #fff;
    box-shadow: 0 16px 40px rgba(140,98,67,.16);
    animation: bob 4s ease-in-out infinite; will-change: transform; position: relative; z-index: 2;
  }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-10px) rotate(.6deg); } }
  .tape {
    position: absolute; top: -10px; left: 50%; width: 110px; height: 28px; margin-left: -55px; z-index: 3;
    background: var(--pink); opacity: .8; border-radius: 4px; transform: rotate(-3deg);
    background-image: repeating-linear-gradient(90deg, transparent 0 10px, rgba(255,255,255,.35) 10px 14px);
  }
  .drop {
    position: absolute; width: 14px; height: 18px; background: var(--blue);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; opacity: .85;
    animation: splash 2.4s ease-in-out infinite; pointer-events: none; z-index: 3;
  }
  .drop::after { content: ""; position: absolute; left: 3px; top: 4px; width: 4px; height: 6px; border-radius: 50%; background: rgba(255,255,255,.8); }
  .drop.d1 { left: -14px; top: 30%; animation-delay: 0s; }
  .drop.d2 { right: -12px; top: 22%; animation-delay: .8s; transform: scale(.8); }
  .drop.d3 { left: -6px; top: 72%; animation-delay: 1.5s; transform: scale(.7); }
  .drop.d4 { right: -16px; top: 64%; animation-delay: .4s; transform: scale(.9); }
  @keyframes splash { 0%, 100% { translate: 0 0; } 50% { translate: 0 -14px; } }
  .sparkle {
    position: absolute; width: 18px; height: 18px; pointer-events: none; z-index: 3;
    background: var(--yellow);
    clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
    animation: twinkle 2s ease-in-out infinite; opacity: 0;
  }
  .sparkle.s1 { left: -22px; top: 6%; } .sparkle.s2 { right: -20px; top: 44%; animation-delay: .7s; } .sparkle.s3 { right: 10%; top: -24px; animation-delay: 1.3s; transform: scale(.7); }
  @keyframes twinkle { 0%,100% { opacity: 0; scale: .3; rotate: 0deg; } 50% { opacity: 1; scale: 1; rotate: 45deg; } }

  /* 수달 캐릭터(작게): 카드 모서리에서 빼꼼 */
  .otter-peek {
    position: absolute; right: 4px; top: -46px; width: 76px; z-index: 3;
    animation: peek 3.5s ease-in-out infinite; transform-origin: 50% 100%; pointer-events: none;
    filter: drop-shadow(0 4px 6px rgba(140,98,67,.15));
  }
  @keyframes peek { 0%,100% { transform: rotate(-5deg) translateY(3px); } 50% { transform: rotate(5deg) translateY(-5px); } }
  .otter-dday { width: 72px; display: block; margin: 0 auto 6px; animation: bob 3.4s ease-in-out infinite; }

  .hero .name { font-family: var(--head); font-size: 28px; color: var(--brown); margin-top: 4px; animation: popIn .8s .5s cubic-bezier(.34,1.56,.64,1) both; }
  .hero .sub { margin-top: 2px; color: var(--muted); font-size: 14px; animation: popIn .8s .6s both; }
  .hero .date {
    display: inline-block; margin-top: 18px; padding: 10px 22px; border-radius: 999px;
    background: var(--pink-soft); color: var(--brown); font-size: 15px; font-family: var(--head);
    animation: popIn .8s .7s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes popIn { from { opacity: 0; transform: translateY(16px) scale(.9); } to { opacity: 1; transform: none; } }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 90; }

  /* ---------- 발자국 구분선 ---------- */
  .paws { display: flex; justify-content: center; gap: 22px; padding: 0 0 8px; height: 40px; }
  .paws svg { width: 22px; height: 22px; fill: var(--cream); opacity: 0; transform: scale(.4); transition: opacity .4s, transform .4s cubic-bezier(.34,1.56,.64,1); }
  .paws svg:nth-child(even) { translate: 0 10px; }
  .paws.in svg { opacity: 1; transform: scale(1); }
  .paws.in svg:nth-child(1) { transition-delay: 0s; } .paws.in svg:nth-child(2) { transition-delay: .15s; } .paws.in svg:nth-child(3) { transition-delay: .3s; }
  .paws.in svg:nth-child(4) { transition-delay: .45s; } .paws.in svg:nth-child(5) { transition-delay: .6s; }

  /* ---------- 인사말 ---------- */
  .greeting .card {
    margin-top: 22px;
    background: var(--paper); border-radius: 24px; padding: 32px 24px;
    box-shadow: 0 10px 30px rgba(140,98,67,.08); position: relative;
  }
  .greeting .card::before, .greeting .card::after {
    content: "♥"; position: absolute; color: var(--pink); font-size: 20px; animation: heartbeat 2s ease-in-out infinite;
  }
  .greeting .card::before { left: 16px; top: 12px; } .greeting .card::after { right: 16px; bottom: 10px; animation-delay: 1s; }
  .greeting p + p { margin-top: 16px; }
  .greeting .quote { font-family: var(--head); font-size: 19px; color: var(--brown); }
  .parents { margin-top: 28px; font-size: 15px; font-family: var(--head); color: var(--brown); }

  /* ---------- D-day 달력 ---------- */
  .calendar { max-width: 320px; margin: 0 auto; background: var(--paper); border-radius: 24px; padding: 20px 16px; box-shadow: 0 10px 30px rgba(140,98,67,.08); }
  .cal-month { text-align: center; font-family: var(--head); font-size: 20px; margin-bottom: 16px; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px 0; text-align: center; font-size: 14px; }
  .cal-grid .dow { color: var(--muted); font-size: 12px; margin-bottom: 4px; font-family: var(--head); }
  .cal-grid .dow.sun, .cal-grid .d.sun { color: var(--pink); }
  .cal-grid .d { height: 36px; line-height: 36px; }
  .cal-grid .d.event { position: relative; color: #fff; font-family: var(--head); z-index: 0; }
  .cal-grid .d.event::before {
    content: ""; position: absolute; inset: 2px 50% 2px 50%; width: 32px; height: 32px;
    margin-left: -16px; border-radius: 50%; background: var(--pink); z-index: -1;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .cal-grid .d.event::after {
    content: "♥"; position: absolute; right: 2px; top: -10px; font-size: 12px; color: var(--pink); line-height: 1;
    animation: heartbeat 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(245,155,176,.5); } 60% { box-shadow: 0 0 0 10px rgba(245,155,176,0); } }
  .dday { text-align: center; margin-top: 28px; }
  .dday strong { font-family: var(--head); font-size: 40px; color: var(--pink); display: block; line-height: 1.2; }
  .dday span { font-size: 14px; color: var(--muted); }

  /* ---------- 갤러리 ---------- */
  .gallery-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .polaroid {
    background: var(--paper); padding: 8px 8px 28px; border-radius: 12px;
    box-shadow: 0 8px 20px rgba(140,98,67,.12);
    transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
    opacity: .85; position: relative;
    transition: transform .9s cubic-bezier(.22,1,.36,1), opacity .9s ease;
    will-change: transform, opacity;
  }
  .polaroid::after {
    content: ""; position: absolute; left: 50%; top: -8px; width: 44px; height: 14px; margin-left: -22px;
    background: var(--blue); opacity: .7; border-radius: 3px; transform: rotate(-3deg);
  }
  .polaroid:nth-child(even)::after { background: var(--pink); transform: rotate(4deg); }
  .polaroid img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--line); border-radius: 6px; }
  .gallery-grid.settled .polaroid { transform: rotate(var(--rest)); opacity: 1; }
  .gallery-grid.settled .polaroid:active { transform: rotate(0) scale(1.04); }

  /* ---------- 일시/장소 ---------- */
  .info dl { display: grid; grid-template-columns: 56px 1fr; gap: 12px 16px; font-size: 15px; background: var(--paper); border-radius: 24px; padding: 24px; box-shadow: 0 10px 30px rgba(140,98,67,.08); }
  .info dt { color: var(--pink); font-family: var(--head); }
  .map-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 20px; }
  .map-btns a, .bouncy {
    display: block; padding: 12px 0; text-align: center; font-size: 13px; text-decoration: none; font-family: var(--head);
    color: var(--brown); background: var(--paper); border: 2px solid var(--line); border-radius: 16px;
    transition: transform .15s cubic-bezier(.34,1.56,.64,1), border-color .15s;
  }
  .map-btns a:active, .bouncy:active { transform: scale(.94); border-color: var(--pink); }

  /* ---------- 안내사항 ---------- */
  .notice-list { list-style: none; display: grid; gap: 12px; }
  .notice-list li { background: var(--paper); border-radius: 18px; padding: 16px 18px 16px 52px; font-size: 14px; position: relative; box-shadow: 0 6px 18px rgba(140,98,67,.06); }
  .notice-list li::before {
    content: ""; position: absolute; left: 16px; top: 18px; width: 24px; height: 24px; border-radius: 50%;
    background: var(--blue-soft);
  }
  .notice-list li::after {
    position: absolute; left: 20px; top: 16px; font-size: 14px;
  }
  .notice-list li:nth-child(1)::after { content: "🚗"; } .notice-list li:nth-child(2)::after { content: "🍰"; } .notice-list li:nth-child(3)::after { content: "👕"; }
  .notice-list li:nth-child(n+4)::after { content: "💌"; }
  .notice-list b { display: block; font-family: var(--head); font-weight: 400; color: var(--brown); margin-bottom: 2px; }

  /* ---------- 연락처 ---------- */
  .contact-list { list-style: none; display: grid; gap: 12px; }
  .contact-list li {
    background: var(--paper); border-radius: 18px; padding: 14px 18px; font-size: 14px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; box-shadow: 0 6px 18px rgba(140,98,67,.06);
  }
  .contact-list a {
    color: #fff; background: var(--pink); text-decoration: none; padding: 6px 14px; border-radius: 999px; font-family: var(--head); font-size: 13px;
    transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .contact-list a:active { transform: scale(.92); }

  /* ---------- 공유 ---------- */
  .share { text-align: center; }
  .share-btn {
    display: inline-flex; align-items: center; gap: 8px; padding: 16px 32px; border-radius: 999px; border: 0;
    background: linear-gradient(135deg, var(--pink), #f7b7c6); color: #fff; font-size: 17px; font-family: var(--head);
    box-shadow: 0 10px 24px rgba(245,155,176,.4); cursor: pointer;
    animation: wiggle 2.6s ease-in-out infinite; transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .share-btn:active { transform: scale(.94); }
  @keyframes wiggle { 0%,85%,100% { rotate: 0deg; } 88% { rotate: -3deg; } 91% { rotate: 3deg; } 94% { rotate: -2deg; } 97% { rotate: 2deg; } }

  /* ---------- 참석 여부 / 방명록 ---------- */
  .form { display: grid; gap: 12px; }
  .form input[type=text], .form textarea, .form select {
    width: 100%; padding: 12px 16px; font: inherit; font-size: 15px; color: var(--ink);
    background: var(--paper); border: 2px solid var(--line); border-radius: 16px; outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .form textarea { min-height: 88px; resize: vertical; }
  .form input:focus, .form textarea:focus, .form select:focus { border-color: var(--pink); box-shadow: 0 0 0 4px var(--pink-soft); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg label {
    display: block; text-align: center; padding: 12px; border-radius: 16px; font-size: 14px; font-family: var(--head);
    background: var(--paper); border: 2px solid var(--line); cursor: pointer; transition: transform .15s cubic-bezier(.34,1.56,.64,1), background .2s, border-color .2s;
  }
  .seg label:active { transform: scale(.95); }
  .seg input { display: none; }
  .seg input:checked + span { color: var(--brown); }
  .seg label:has(input:checked) { border-color: var(--pink); background: var(--pink-soft); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row label { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
  .hp { position: absolute; left: -9999px; }
  .submit {
    padding: 14px; border-radius: 16px; border: 0; background: var(--pink); color: #fff;
    font: inherit; font-family: var(--head); font-size: 16px; cursor: pointer;
    box-shadow: 0 8px 20px rgba(245,155,176,.35); transition: transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .submit:active { transform: scale(.95); }
  .submit:disabled { opacity: .5; }
  .form-done { text-align: center; padding: 28px; background: var(--blue-soft); border-radius: 20px; color: var(--brown); font-family: var(--head); font-size: 16px; animation: popIn .6s cubic-bezier(.34,1.56,.64,1); }
  .gb-list { list-style: none; display: grid; gap: 10px; margin-top: 28px; }
  .gb-list li {
    background: var(--paper); border-radius: 18px; padding: 14px 18px; font-size: 14px; position: relative;
    box-shadow: 0 6px 18px rgba(140,98,67,.06);
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1) both; animation-delay: calc(var(--i) * 60ms);
  }
  .gb-list li:nth-child(odd) { border-left: 4px solid var(--blue); } .gb-list li:nth-child(even) { border-left: 4px solid var(--pink); }
  .gb-list b { font-family: var(--head); font-weight: 400; color: var(--brown); }
  .gb-list time { float: right; font-size: 12px; color: var(--muted); }
  .gb-list p { text-align: left; margin-top: 4px; white-space: pre-wrap; }
  .gb-empty { text-align: center; color: var(--muted); font-size: 14px; margin-top: 20px; }
  .hidden { display: none !important; }

  footer { text-align: center; padding: 24px 24px 72px; color: var(--muted); font-size: 13px; font-family: var(--head); letter-spacing: .1em; }
  footer .mini-otter { display: block; width: 72px; margin: 0 auto 8px; animation: peek 4s ease-in-out infinite; transform-origin: 50% 100%; }

  /* ---------- 탭 하트 ---------- */
  .tap-heart { position: fixed; pointer-events: none; z-index: 95; color: var(--pink); font-size: 20px; animation: tapHeart .9s ease-out forwards; }
  @keyframes tapHeart { 0% { opacity: 1; transform: translate(-50%, -50%) scale(.4); } 100% { opacity: 0; transform: translate(-50%, -140%) scale(1.3) rotate(var(--r)); } }

  .toast {
    position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%) translateY(20px);
    background: rgba(107,74,53,.92); color: #fff; padding: 10px 18px; border-radius: 999px;
    font-size: 13px; font-family: var(--head); opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; z-index: 110;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {

const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------- 렌더링 ---------- */
(function render() {

    .join("");

  $("notices").innerHTML = CONFIG.notices.map((n) => `<li><b>${n.title}</b>${n.body}</li>`).join("");

  $("contacts").innerHTML = CONFIG.contacts
    .map((c) => `<li><span>${c.label}</span><a href="tel:${c.phone}">${c.phone}</a></li>`)
    .join("");

  $("footer").textContent = CONFIG.footer;

  // 발자국 구분선
  const paw = `<svg viewBox="0 0 24 24"><ellipse cx="12" cy="15.5" rx="5.5" ry="4.5"/><circle cx="5" cy="10" r="2.3"/><circle cx="9.3" cy="6" r="2.3"/><circle cx="14.7" cy="6" r="2.3"/><circle cx="19" cy="10" r="2.3"/></svg>`;
  document.querySelectorAll(".paws").forEach((el) => { el.innerHTML = paw.repeat(5); });
})();

/* ---------- 배경 떠다니는 하트/물방울 ---------- */
(function floaters() {
  if (REDUCED) return;
  const layer = document.getElementById("floatLayer");
  let html = "";
  for (let i = 0; i < 14; i++) {
    const heart = i % 3 === 0;
    const x = Math.round(Math.random() * 100), s = heart ? 12 + Math.random() * 14 : 8 + Math.random() * 14;
    const d = 14 + Math.random() * 12, delay = -Math.random() * 26;
    html += `<span class="${heart ? "heart" : "bubble"}" style="--x:${x}%;--s:${s}px;--d:${d}s;--delay:${delay}s">${heart ? "♥" : ""}</span>`;
  }
  layer.innerHTML = html;
})();

/* ---------- 스크롤 등장 (.reveal, .paws) ---------- */
(function reveal() {
  const els = document.querySelectorAll(".reveal, .paws");
  if (REDUCED || !("IntersectionObserver" in window)) { els.forEach((e) => e.classList.add("in")); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { threshold: 0.15, rootMargin: "0px 0px -40px 0px" });
  els.forEach((e) => io.observe(e));
})();

/* ---------- D-day 달력 + 카운트업 ---------- */
(function calendar() {
  const ev = new Date(CONFIG.event.iso);
  const y = ev.getFullYear(), m = ev.getMonth(), d = ev.getDate();
  document.getElementById("calTitle").textContent = `${y}년 ${m + 1}월`;

  const dows = ["일", "월", "화", "수", "목", "금", "토"];
  const first = new Date(y, m, 1).getDay();
  const last = new Date(y, m + 1, 0).getDate();
  let html = dows.map((w, i) => `<div class="dow${i === 0 ? " sun" : ""}">${w}</div>`).join("");
  for (let i = 0; i < first; i++) html += `<div class="d"></div>`;
  for (let day = 1; day <= last; day++) {
    const sun = (first + day - 1) % 7 === 0;
    html += `<div class="d${sun ? " sun" : ""}${day === d ? " event" : ""}">${day}</div>`;
  }
  document.getElementById("calGrid").innerHTML = html;

  const today = new Date(); today.setHours(0, 0, 0, 0);
  const target = new Date(y, m, d);
  const diff = Math.round((target - today) / 86400000);
  const num = document.getElementById("ddayNum"), txt = document.getElementById("ddayText");
  const name = CONFIG.baby.name;
  let prefix = "", n = Math.abs(diff);
  if (diff > 0) { prefix = "D-"; txt.textContent = `${name}의 돌잔치까지 ${diff}일 남았어요`; }
  else if (diff === 0) { num.textContent = "D-DAY"; txt.textContent = `오늘은 ${name}의 돌잔치 날이에요 🎂`; return; }
  else { prefix = "D+"; txt.textContent = `${name}의 돌잔치가 ${-diff}일 지났어요`; }

  // 화면에 들어오면 0 → n 으로 세어 올라감
  if (REDUCED || !("IntersectionObserver" in window)) { num.textContent = prefix + n; return; }
  num.textContent = prefix + "0";
  const io = new IntersectionObserver((en) => {
    if (!en[0].isIntersecting) return; io.disconnect();
    const t0 = performance.now(), dur = 1200;
    (function step(t) {
      const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      num.textContent = prefix + Math.round(n * e);
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }, { threshold: .6 });
  io.observe(num);
})();

/* ---------- 스크롤 진행률 바 (rAF로 묶음) ---------- */
(function progress() {
  const bar = document.getElementById("progressBar");
  const doc = document.documentElement;
  let ticking = false;
  function update() {
    const max = doc.scrollHeight - window.innerHeight;
    const ratio = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 1;
    bar.style.transform = `scaleX(${ratio})`;
    ticking = false;
  }
  function onScroll() { if (ticking) return; ticking = true; requestAnimationFrame(update); }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", onScroll, { passive: true });
  update();
})();

/* ---------- 갤러리: 흩어진 폴라로이드 → 스크롤 시 정렬 ---------- */
(function gallery() {
  const grid = document.getElementById("gallery");
  const cards = grid.querySelectorAll(".polaroid");
  let seed = 7;
  const rand = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  cards.forEach((el) => {
    el.style.setProperty("--dx", `${(rand() - .5) * 80}px`);
    el.style.setProperty("--dy", `${(rand() - .5) * 120 + 40}px`);
    el.style.setProperty("--rot", `${(rand() - .5) * 30}deg`);
    el.style.setProperty("--rest", `${(rand() - .5) * 5}deg`);   // 정렬 후에도 살짝 삐뚤
  });
  if (REDUCED || !("IntersectionObserver" in window)) { grid.classList.add("settled"); return; }
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { grid.classList.add("settled"); io.disconnect(); } });
  }, { threshold: 0.35 });
  io.observe(grid);
})();

/* ---------- 숫자 1 탭 → 색종이/하트 (canvas, 외부 라이브러리 없음) ---------- */
(function celebrateNumber() {
  const wrap = document.getElementById("numWrap");
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  const COLORS = ["#f59bb0", "#f8d878", "#9fd3f4", "#fbc4d2", "#c9e7f8", "#ffffff"];
  let pieces = [], raf = null, dpr = 1;

  function resize() {
    dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + "px"; canvas.style.height = innerHeight + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function burst(x, y) {
    const n = 110;
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + Math.random() * .3;
      const v = 4 + Math.random() * 7;
      pieces.push({
        x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4,
        w: 6 + Math.random() * 6, h: 4 + Math.random() * 4,
        rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
        color: COLORS[i % COLORS.length], life: 1,
        shape: i % 4 === 0 ? "heart" : i % 4 === 1 ? "circle" : "rect",
      });
    }
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function heart(s) {
    ctx.beginPath();
    ctx.moveTo(0, s * .35);
    ctx.bezierCurveTo(-s, -s * .4, -s * .45, -s * .95, 0, -s * .35);
    ctx.bezierCurveTo(s * .45, -s * .95, s, -s * .4, 0, s * .35);
    ctx.fill();
  }
  function tick() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    pieces = pieces.filter((p) => p.life > 0 && p.y < innerHeight + 20);
    for (const p of pieces) {
      p.vy += .16; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.life -= .006;
      ctx.save();
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
      ctx.fillStyle = p.color;
      if (p.shape === "heart") heart(p.w * .7);
      else if (p.shape === "circle") { ctx.beginPath(); ctx.arc(0, 0, p.h / 2, 0, Math.PI * 2); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    raf = pieces.length ? requestAnimationFrame(tick) : (ctx.clearRect(0, 0, innerWidth, innerHeight), null);
  }
  function celebrate() {
    wrap.classList.remove("pop"); void wrap.offsetWidth; wrap.classList.add("pop");
    if (REDUCED) return;
    const r = wrap.querySelector(".num").getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2);
  }
  resize();
  window.addEventListener("resize", resize, { passive: true });
  wrap.addEventListener("click", celebrate);
  wrap.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); celebrate(); } });
})();

/* ---------- 어디든 탭하면 작은 하트 ---------- */
(function tapHearts() {
  if (REDUCED) return;
  document.addEventListener("pointerdown", (e) => {
    if (e.target.closest("input, textarea, select, button, a, label")) return;
    const h = document.createElement("span");
    h.className = "tap-heart"; h.textContent = "♥";
    h.style.left = e.clientX + "px"; h.style.top = e.clientY + "px";
    h.style.setProperty("--r", `${(Math.random() - .5) * 60}deg`);
    document.body.appendChild(h);
    h.addEventListener("animationend", () => h.remove());
  }, { passive: true });
})();

/* ---------- 공유: Web Share API → 없으면 링크 복사 ---------- */
(function share() {
  const btn = document.getElementById("shareBtn");
  btn.addEventListener("click", async () => {
    const data = CONFIG.share;
    if (navigator.share) {
      try { await navigator.share(data); return; } catch (e) { if (e.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(data.url); showToast("링크가 복사되었습니다 💕"); }
    catch { showToast("복사에 실패했습니다"); }
  });
})();

/* ---------- RSVP + 방명록 (AWS API) ---------- */
(function api() {
  const base = (CONFIG.api.baseUrl || "").replace(/\/$/, "");
  const rsvpSec = document.getElementById("rsvpSection");
  const gbSec = document.getElementById("guestbookSection");
  if (!base) { rsvpSec.classList.add("hidden"); gbSec.classList.add("hidden"); return; }

  const post = async (path, data) => {
    const r = await fetch(base + path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(data) });
    if (!r.ok) throw new Error(r.status);
    return r.json();
  };
  const formData = (f) => Object.fromEntries(new FormData(f).entries());
  const esc = (t) => t.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // RSVP
  const rsvpForm = document.getElementById("rsvpForm");
  rsvpForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = rsvpForm.querySelector(".submit"); btn.disabled = true;
    try {
      await post("/rsvp", formData(rsvpForm));
      rsvpForm.classList.add("hidden");
      document.getElementById("rsvpDone").classList.remove("hidden");
      try { localStorage.setItem("rsvpDone", "1"); } catch {}
    } catch { showToast("전송에 실패했습니다. 잠시 후 다시 시도해주세요"); btn.disabled = false; }
  });
  try { if (localStorage.getItem("rsvpDone")) { rsvpForm.classList.add("hidden"); document.getElementById("rsvpDone").classList.remove("hidden"); } } catch {}

  // 방명록
  const gbForm = document.getElementById("gbForm");
  const gbList = document.getElementById("gbList");
  const gbEmpty = document.getElementById("gbEmpty");
  const fmt = (iso) => { const d = new Date(iso); return `${d.getMonth() + 1}.${d.getDate()}`; };
  function renderList(items) {
    gbList.innerHTML = items.map((it, i) =>
      `<li style="--i:${i}"><b>${esc(it.name)}</b><time>${fmt(it.createdAt)}</time><p>${esc(it.message)}</p></li>`).join("");
    gbEmpty.classList.toggle("hidden", items.length > 0);
  }
  async function load() {
    try { const r = await fetch(base + "/guestbook"); renderList((await r.json()).items || []); }
    catch { gbEmpty.textContent = "방명록을 불러오지 못했습니다"; gbEmpty.classList.remove("hidden"); }
  }
  gbForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = gbForm.querySelector(".submit"); btn.disabled = true;
    try { await post("/guestbook", formData(gbForm)); gbForm.reset(); showToast("메시지를 남겼습니다 💌"); await load(); }
    catch { showToast("전송에 실패했습니다"); }
    btn.disabled = false;
  });
  // 화면에 들어올 때 한 번만 불러오기
  const io = new IntersectionObserver((en) => { if (en[0].isIntersecting) { io.disconnect(); load(); } }, { rootMargin: "200px" });
  io.observe(gbSec);
})();
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove("show"), 1600);
}
</script>
</body>
</html>
